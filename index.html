<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>برج تعادلی - نسخه بتا</title>
    <script src="https://eitaa.com/s/eitaa-web-app.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #2c3e50; font-family: Tahoma, Arial; touch-action: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; width: 100%; text-align: center; color: white; pointer-events: none; }
        #score { font-size: 32px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; color: white; }
        .btn { background: #27ae60; color: white; border: none; padding: 15px 30px; font-size: 20px; border-radius: 10px; cursor: pointer; margin-top: 20px; pointer-events: auto; }
        #leaderboard-content { width: 80%; max-height: 200px; overflow-y: auto; background: rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; margin: 15px 0; }
        .rank-item { display: flex; justify-content: space-between; padding: 5px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div id="ui"><div id="score">۰</div></div>
    
    <div id="auth-screen" class="overlay">
        <h2 id="status-text">در حال تأیید ورود به ایتا...</h2>
    </div>

    <div id="start-screen" class="overlay" style="display:none;">
        <h1>برج تعادلی</h1>
        <div id="leaderboard-content">در حال دریافت رتبه‌بندی...</div>
        <button class="btn" onclick="startGame()">شروع بازی</button>
    </div>

    <div id="game-over-screen" class="overlay" style="display:none;">
        <h1 style="color:#e74c3c;">بازی تمام شد!</h1>
        <div id="final-score-text">امتیاز نهایی: ۰</div>
        <button class="btn" onclick="startGame()">دوباره بازی کن</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
